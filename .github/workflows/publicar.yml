name: CI y publicación

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  publicar:
    name: Publicar en GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Por ahora se publica la versión 2 (la que se usa hoy). Al pasar a la 3, se cambia por frontend/dist.
      - name: Montar el sitio
        run: |
          mkdir _site
          cp -R frontend/public/. _site/
          cp -R frontend/legado/. _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v5